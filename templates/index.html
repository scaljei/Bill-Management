<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bill Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --surface2: #1e2430;
    --border: #2a3142;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --danger: #ff4757;
    --success: #2ed573;
    --warn: #ffa502;
    --text: #e8ecf4;
    --muted: #6b7591;
    --card-r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; }
  
  /* Layout */
  .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  
  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .logo p { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }

  .nav { padding: 16px 12px; flex: 1; overflow-y: auto; }
  .nav-btn {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; border: none;
    background: transparent; color: var(--muted); cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 13px;
    text-align: left; transition: all 0.15s;
    margin-bottom: 2px;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #000; font-weight: 500; }
  .nav-btn .icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-divider { height: 1px; background: var(--border); margin: 10px 0; }
  .nav-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; padding: 4px 12px; }

  /* Stats strip in sidebar */
  .stat-strip { padding: 16px; border-top: 1px solid var(--border); }
  .stat-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stat-item:last-child { border: none; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-value { font-size: 13px; font-weight: 500; }
  .stat-value.danger { color: var(--danger); }
  .stat-value.warn { color: var(--warn); }
  .stat-value.success { color: var(--success); }

  /* Main */
  .main { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    padding: 20px 32px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; flex: 1; }
  .search-wrap { position: relative; }
  .search-wrap input {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px 8px 36px;
    border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 13px;
    width: 220px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .s-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #d4eb00; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Content */
  .content { padding: 28px 32px; flex: 1; }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--text); color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

  /* Bills table */
  .bills-table-wrap { overflow-x: auto; border-radius: var(--card-r); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--surface2); }
  th { padding: 12px 16px; text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
  td { padding: 13px 16px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr { transition: background 0.1s; }
  tr:hover td { background: var(--surface2); }
  
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
  }
  .badge-y { background: rgba(46,213,115,0.15); color: var(--success); }
  .badge-n { background: rgba(255,71,87,0.15); color: var(--danger); }
  .badge-col { background: rgba(255,165,2,0.15); color: var(--warn); }
  .badge-cat { background: rgba(232,255,71,0.1); color: var(--accent); border: 1px solid rgba(232,255,71,0.2); }

  .overdue-row td { border-left: 3px solid var(--danger); }
  .amount { font-weight: 500; }

  .actions { display: flex; gap: 6px; }

  /* Empty state */
  .empty { text-align: center; padding: 80px 20px; }
  .empty .e-icon { font-size: 48px; margin-bottom: 16px; }
  .empty p { color: var(--muted); font-size: 14px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; width: 100%; max-width: 620px; max-height: 92vh;
    overflow-y: auto; transform: translateY(20px); transition: transform 0.2s;
    padding: 32px;
  }
  .overlay.open .modal { transform: translateY(0); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .modal-header h3 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
  .close-btn { background: var(--surface2); border: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px; transition: color 0.15s; }
  .close-btn:hover { color: var(--text); }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .field input, .field select, .field textarea {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 8px;
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select option { background: var(--surface); }
  .radio-row { display: flex; gap: 12px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .radio-row input[type=radio] { accent-color: var(--accent); }

  /* PDF upload zone */
  .pdf-zone {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 20px; text-align: center; cursor: pointer;
    transition: all 0.2s; position: relative;
  }
  .pdf-zone:hover { border-color: var(--accent); }
  .pdf-zone.has-file { border-color: var(--success); background: rgba(46,213,115,0.05); }
  .pdf-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pdf-zone p { font-size: 12px; color: var(--muted); }
  .pdf-zone .pdf-name { color: var(--success); font-size: 13px; margin-top: 4px; }

  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* Detail panel */
  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: stretch; justify-content: flex-end;
    z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: all; }
  .detail-panel {
    background: var(--surface); border-left: 1px solid var(--border);
    width: 520px; max-width: 100%; overflow-y: auto; padding: 32px;
    transform: translateX(40px); transition: transform 0.25s;
  }
  .detail-overlay.open .detail-panel { transform: translateX(0); }

  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
  .detail-provider { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
  .detail-amount { font-size: 32px; font-weight: 700; color: var(--accent); margin: 4px 0 16px; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
  .detail-field { background: var(--surface2); border-radius: 8px; padding: 12px; }
  .detail-field .dl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .detail-field .dv { font-size: 14px; }

  .section-title { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

  /* Links section */
  .link-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; cursor: pointer; transition: background 0.15s; }
  .link-item:hover { background: var(--border); }
  .link-info { flex: 1; }
  .link-info .lp { font-size: 13px; font-weight: 500; }
  .link-info .lm { font-size: 11px; color: var(--muted); }
  .link-del { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; }
  .link-del:hover { color: var(--danger); }

  .add-link-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .add-link-wrap select { width: 100%; }

  /* Audit log */
  .audit-feed { display: flex; flex-direction: column; gap: 0; }
  .audit-entry {
    display: flex; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid var(--border); position: relative;
  }
  .audit-entry:last-child { border-bottom: none; }
  .audit-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-top: 5px; flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(232,255,71,0.15);
  }
  .audit-body { flex: 1; }
  .audit-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .audit-meta strong { color: var(--text); }
  .audit-note { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .audit-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 5px; border-radius: 4px; opacity: 0; transition: opacity 0.15s; }
  .audit-entry:hover .audit-del { opacity: 1; }
  .audit-del:hover { color: var(--danger); }
  .audit-compose { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .audit-compose textarea {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 8px;
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none;
    resize: vertical; min-height: 72px; transition: border-color 0.2s;
  }
  .audit-compose textarea:focus { border-color: var(--accent); }
  .audit-compose-row { display: flex; gap: 8px; align-items: center; }
  .audit-compose-row input {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 8px;
    font-family: 'DM Mono', monospace; font-size: 12px; outline: none;
    width: 130px; transition: border-color 0.2s;
  }
  .audit-compose-row input:focus { border-color: var(--accent); }
  .audit-empty { font-size: 13px; color: var(--muted); padding: 12px 0; }

  /* OCR badges */
  .ocr-badge {
    display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: rgba(232,255,71,0.15); color: var(--accent);
    border: 1px solid rgba(232,255,71,0.3); margin-left: 5px;
    vertical-align: middle; letter-spacing: 0.3px;
  }
  .ocr-scanning { color: var(--muted); font-size: 12px; }
  .field input.ocr-filled, .field textarea.ocr-filled, .field select.ocr-filled {
    border-color: rgba(232,255,71,0.5);
    background: rgba(232,255,71,0.04);
  }

  /* PDF viewer */
  .pdf-viewer { width: 100%; height: 400px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: 10px; font-size: 13px;
    z-index: 999; transform: translateY(10px); opacity: 0;
    transition: all 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-left: 3px solid var(--success); }
  .toast.err { border-left: 3px solid var(--danger); }

  /* Bulk upload */
  .bulk-drop-zone {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 40px 20px; text-align: center; position: relative;
    transition: all 0.2s; cursor: default;
  }
  .bulk-drop-zone.drag-over { border-color: var(--accent); background: rgba(232,255,71,0.04); }
  .bulk-drop-zone input[type=file] { display: none; }
  .bulk-drop-inner { pointer-events: none; }
  .bulk-drop-inner button { pointer-events: all; }

  .bulk-file-row {
    display: grid; grid-template-columns: 180px 1fr 1fr 90px 90px 32px;
    gap: 8px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .bulk-file-row:first-child { border-top: 1px solid var(--border); }
  .bulk-file-row.done { opacity: 0.5; }
  .bulk-file-row.error td { color: var(--danger); }
  .bulk-file-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bulk-file-name span { display: block; font-size: 10px; color: var(--muted); }
  .bulk-status { font-size: 11px; text-align: center; }
  .bulk-header {
    display: grid; grid-template-columns: 180px 1fr 1fr 90px 90px 32px;
    gap: 8px; padding: 6px 12px;
    font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
    background: var(--surface2); border-radius: 8px 8px 0 0;
    margin-top: 16px;
  }
  .bulk-queue-wrap { border-radius: 0 0 8px 8px; overflow: hidden; max-height: 340px; overflow-y: auto; }
  .bulk-file-row input, .bulk-file-row select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 8px; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 12px; outline: none; width: 100%;
  }
  .bulk-file-row input:focus, .bulk-file-row select:focus { border-color: var(--accent); }
  .bulk-remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
  .bulk-remove-btn:hover { color: var(--danger); }

  /* Responsive */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .detail-panel { width: 100%; }
  }
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h1>Bill<span>Vault</span></h1>
      <p>PDF Bill Tracker</p>
    </div>
    <nav class="nav">
      <button class="nav-btn active" onclick="setView('all')"><span class="icon">📋</span> All Bills</button>
      <button class="nav-btn" onclick="setView('unpaid')"><span class="icon">⏳</span> Unpaid</button>
      <button class="nav-btn" onclick="setView('overdue')"><span class="icon">🔴</span> Overdue</button>
      <button class="nav-btn" onclick="setView('paid')"><span class="icon">✅</span> Paid</button>
      <button class="nav-btn" onclick="setView('collections')"><span class="icon">⚠️</span> Collections</button>
      <div class="nav-divider"></div>
      <div class="nav-label">Categories</div>
      <div id="cat-nav"></div>
    </nav>
    <div class="stat-strip" id="stat-strip"></div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2 id="view-title">All Bills</h2>
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search provider, acct…" oninput="debounceLoad()"/>
      </div>
      <button class="btn btn-primary" onclick="openModal()">＋ Add Bill</button>
      <button class="btn btn-ghost" onclick="openBulkModal()" title="Upload multiple PDFs from a folder">📁 Bulk Upload</button>
    </div>
    <div class="content">
      <div class="filters" id="filter-row"></div>
      <div id="bills-container"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="form-overlay" onclick="overlayClose(event, 'form-overlay')">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Add Bill</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <form id="bill-form" enctype="multipart/form-data" onsubmit="submitBill(event)">
      <input type="hidden" id="edit-id"/>
      <div class="form-grid">
        <div class="field full">
          <label>Provider *</label>
          <input type="text" name="provider" required placeholder="e.g. AT&T, City Water Dept"/>
        </div>
        <div class="field">
          <label>Account #</label>
          <input type="text" name="account_number" placeholder="Account number"/>
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" name="category" placeholder="Utilities, Medical, Rent…" list="cat-list"/>
          <datalist id="cat-list"></datalist>
        </div>
        <div class="field">
          <label>Statement Date</label>
          <input type="date" name="statement_date"/>
        </div>
        <div class="field">
          <label>Amount Due ($)</label>
          <input type="number" step="0.01" name="amount_due" placeholder="0.00"/>
        </div>
        <div class="field">
          <label>Due Date</label>
          <input type="date" name="due_date"/>
        </div>
        <div class="field">
          <label>Paid</label>
          <div class="radio-row">
            <label><input type="radio" name="paid" value="N" checked/> No</label>
            <label><input type="radio" name="paid" value="Y"/> Yes</label>
          </div>
        </div>
        <div class="field">
          <label>In Collections</label>
          <div class="radio-row">
            <label><input type="radio" name="in_collections" value="N" checked/> No</label>
            <label><input type="radio" name="in_collections" value="Y"/> Yes</label>
          </div>
        </div>
        <div class="field full">
          <label>Notes</label>
          <textarea name="notes" placeholder="Any additional notes…"></textarea>
        </div>
        <div class="field full">
          <label>PDF Statement</label>
          <div class="pdf-zone" id="pdf-zone">
            <input type="file" name="pdf" accept=".pdf" onchange="onPdfChange(this)"/>
            <div>📄 <span id="pdf-zone-text">Drop PDF or click to upload — fields will be auto-detected</span></div>
            <div class="pdf-name" id="pdf-name-display"></div>
          </div>
          <div id="ocr-status" style="display:none;margin-top:6px;font-size:12px;color:var(--muted)"></div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Bill</button>
      </div>
    </form>
  </div>
</div>

<!-- Bulk Upload Modal -->
<div class="overlay" id="bulk-overlay" onclick="overlayClose(event, 'bulk-overlay')">
  <div class="modal" style="max-width:820px">
    <div class="modal-header">
      <h3>📁 Bulk Upload PDFs</h3>
      <button class="close-btn" onclick="closeBulkModal()">✕</button>
    </div>

    <!-- Drop zone -->
    <div class="bulk-drop-zone" id="bulk-drop-zone">
      <input type="file" id="bulk-file-input" accept=".pdf" multiple
        onchange="onBulkFiles(this.files)"/>
      <input type="file" id="bulk-folder-input" accept=".pdf" multiple webkitdirectory
        onchange="onBulkFiles(this.files)"/>
      <div class="bulk-drop-inner">
        <div style="font-size:36px;margin-bottom:8px">📂</div>
        <p style="font-size:14px;font-weight:600;margin-bottom:4px">Drop PDFs here or choose</p>
        <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Supports individual files or an entire folder</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById('bulk-file-input').click()">Select Files</button>
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('bulk-folder-input').click()">Select Folder</button>
        </div>
      </div>
    </div>

    <!-- Shared defaults -->
    <div id="bulk-defaults-wrap" style="display:none">
      <p class="section-title" style="margin-top:20px">Default Values (applied to all files — override per file below)</p>
      <div class="form-grid" style="margin-bottom:4px">
        <div class="field">
          <label>Category</label>
          <input type="text" id="bulk-default-category" placeholder="e.g. Utilities" list="cat-list"/>
        </div>
        <div class="field">
          <label>Paid</label>
          <div class="radio-row">
            <label><input type="radio" name="bulk_paid" value="N" checked/> No</label>
            <label><input type="radio" name="bulk_paid" value="Y"/> Yes</label>
          </div>
        </div>
        <div class="field">
          <label>In Collections</label>
          <div class="radio-row">
            <label><input type="radio" name="bulk_collections" value="N" checked/> No</label>
            <label><input type="radio" name="bulk_collections" value="Y"/> Yes</label>
          </div>
        </div>
        <div class="field">
          <label>Due Date</label>
          <input type="date" id="bulk-default-due"/>
        </div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:4px;margin-bottom:16px" onclick="applyDefaults()">↓ Apply to all rows</button>
    </div>

    <!-- File queue -->
    <div id="bulk-queue"></div>

    <!-- Actions -->
    <div id="bulk-actions" style="display:none;margin-top:20px;display:none">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" id="bulk-import-btn" onclick="runBulkImport()">⬆ Import All</button>
        <button class="btn btn-ghost" onclick="closeBulkModal()">Cancel</button>
        <span id="bulk-progress" style="font-size:13px;color:var(--muted)"></span>
      </div>
      <!-- Progress bar -->
      <div style="margin-top:12px;background:var(--surface2);border-radius:4px;height:6px;overflow:hidden">
        <div id="bulk-bar" style="height:100%;background:var(--accent);width:0;transition:width 0.3s"></div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detail-overlay" onclick="overlayClose(event, 'detail-overlay')">
  <div class="detail-panel" id="detail-panel"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentView = 'all';
let currentBills = [];
let searchTimer;
let allBillsForLink = [];

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── View ──────────────────────────────────────────────────────────────────────

function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('search-input').value = '';
  loadBills();
  const titles = { all: 'All Bills', unpaid: 'Unpaid Bills', overdue: 'Overdue Bills', paid: 'Paid Bills', collections: 'In Collections' };
  document.getElementById('view-title').textContent = titles[v] || '📂 ' + v;
}

function debounceLoad() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadBills, 300);
}

async function loadBills() {
  const search = document.getElementById('search-input').value;
  let url = '/api/bills?';
  if (search) url += `search=${encodeURIComponent(search)}&`;
  if (currentView === 'unpaid') url += 'paid=N&';
  if (currentView === 'paid') url += 'paid=Y&';
  if (currentView === 'collections') url += 'collections=Y&';
  if (currentView !== 'all' && currentView !== 'unpaid' && currentView !== 'paid' && currentView !== 'overdue' && currentView !== 'collections') {
    url += `category=${encodeURIComponent(currentView)}&`;
  }

  const bills = await api(url);
  const today = new Date().toISOString().split('T')[0];
  currentBills = currentView === 'overdue'
    ? bills.filter(b => b.paid === 'N' && b.due_date && b.due_date < today)
    : bills;
  renderTable(currentBills);
  loadStats();
}

function renderTable(bills) {
  const container = document.getElementById('bills-container');
  if (!bills.length) {
    container.innerHTML = `<div class="empty"><div class="e-icon">🗂️</div><p>No bills found</p></div>`;
    return;
  }
  const today = new Date().toISOString().split('T')[0];
    const rows = bills.map(b => {
    const isOverdue = b.paid === 'N' && b.due_date && b.due_date < today;
    const amt = b.amount_due != null ? '$' + b.amount_due.toFixed(2) : '—';
    const linkedCount = b.linked_count > 0 ? `<span style="color:var(--accent);font-size:12px">🔗 ${b.linked_count}</span>` : '—';
    return `<tr class="${isOverdue ? 'overdue-row' : ''}" onclick="openDetail(${b.id})" style="cursor:pointer">
      <td><strong>${esc(b.provider)}</strong><br><span style="color:var(--muted);font-size:11px">${esc(b.account_number||'')}</span></td>
      <td>${b.category ? `<span class="badge badge-cat">${esc(b.category)}</span>` : '—'}</td>
      <td class="amount">${amt}</td>
      <td>${b.due_date || '—'}${isOverdue ? ' <span style="color:var(--danger);font-size:10px">OVERDUE</span>' : ''}</td>
      <td>${b.statement_date || '—'}</td>
      <td><span class="badge badge-${b.paid}">${b.paid}</span></td>
      <td>${b.in_collections === 'Y' ? '<span class="badge badge-col">YES</span>' : '<span class="badge badge-n">No</span>'}</td>
      <td>${b.pdf_filename ? `<span title="${esc(b.pdf_filename)}" style="color:var(--accent)">📄</span>` : ''}</td>
      <td>${linkedCount}</td>
      <td onclick="event.stopPropagation()">
        <div class="actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${b.id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteBill(${b.id})">Del</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  container.innerHTML = `
    <div class="bills-table-wrap">
      <table>
        <thead><tr>
          <th>Provider / Acct</th><th>Category</th><th>Amount</th><th>Due Date</th>
          <th>Statement Date</th><th>Paid</th><th>Collections</th><th>PDF</th><th>Linked</th><th>Actions</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    document.getElementById('stat-strip').innerHTML = `
      <div class="stat-item"><span class="stat-label">Total Bills</span><span class="stat-value">${s.total}</span></div>
      <div class="stat-item"><span class="stat-label">Unpaid</span><span class="stat-value warn">${s.unpaid}</span></div>
      <div class="stat-item"><span class="stat-label">Overdue</span><span class="stat-value danger">${s.overdue}</span></div>
      <div class="stat-item"><span class="stat-label">Collections</span><span class="stat-value danger">${s.in_collections}</span></div>
      <div class="stat-item"><span class="stat-label">Total Owed</span><span class="stat-value danger">$${(s.total_owed||0).toFixed(2)}</span></div>
      <div class="stat-item"><span class="stat-label">In Collections</span><span class="stat-value warn">$${(s.collections_amount||0).toFixed(2)}</span></div>
    `;
    const catNav = document.getElementById('cat-nav');
    catNav.innerHTML = (s.categories || []).map(c =>
      `<button class="nav-btn" onclick="setView(${JSON.stringify(c.category)})"><span class="icon">🏷</span> ${esc(c.category)} <span style="margin-left:auto;font-size:11px;color:var(--muted)">${c.cnt}</span></button>`
    ).join('');
    // Update category datalist
    const dl = document.getElementById('cat-list');
    dl.innerHTML = (s.categories || []).map(c => `<option value="${esc(c.category)}"/>`).join('');
  } catch(e) {}
}

// ── Form Modal ────────────────────────────────────────────────────────────────

function openModal() {
  document.getElementById('modal-title').textContent = 'Add Bill';
  document.getElementById('bill-form').reset();
  document.getElementById('edit-id').value = '';
  document.getElementById('pdf-name-display').textContent = '';
  document.getElementById('pdf-zone').classList.remove('has-file');
  document.getElementById('form-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('form-overlay').classList.remove('open');
}

function overlayClose(e, id) {
  if (e.target.id === id) document.getElementById(id).classList.remove('open');
}

async function openEdit(id) {
  const b = await api(`/api/bills/${id}`);
  document.getElementById('modal-title').textContent = 'Edit Bill';
  document.getElementById('edit-id').value = id;
  const form = document.getElementById('bill-form');
  form.reset();
  form.provider.value = b.provider || '';
  form.account_number.value = b.account_number || '';
  form.category.value = b.category || '';
  form.statement_date.value = b.statement_date || '';
  form.amount_due.value = b.amount_due != null ? b.amount_due : '';
  form.due_date.value = b.due_date || '';
  form.querySelector(`[name=paid][value=${b.paid}]`).checked = true;
  form.querySelector(`[name=in_collections][value=${b.in_collections}]`).checked = true;
  form.notes.value = b.notes || '';
  document.getElementById('pdf-name-display').textContent = b.pdf_filename ? '📎 ' + b.pdf_filename : '';
  document.getElementById('pdf-zone').classList.toggle('has-file', !!b.pdf_filename);
  document.getElementById('form-overlay').classList.add('open');
}

function onPdfChange(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('pdf-name-display').textContent = '📎 ' + file.name;
  document.getElementById('pdf-zone').classList.add('has-file');
  runOcrOnFile(file, 'form');
}

async function runOcrOnFile(file, target) {
  const statusEl = target === 'form' ? document.getElementById('ocr-status') : null;
  if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '🔍 Scanning PDF…'; }

  const fd = new FormData();
  fd.append('pdf', file);
  try {
    const r = await fetch('/api/scan', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    if (target === 'form') {
      applyOcrToForm(data, document.getElementById('bill-form'));
      const detected = data._detected_fields || [];
      const method = data._method === 'ocr' ? 'OCR (scanned)' : 'text extraction';
      statusEl.innerHTML = detected.length
        ? `✨ Auto-detected ${detected.length} field${detected.length>1?'s':''} via ${method}: <strong>${detected.map(f => fieldLabel(f)).join(', ')}</strong> — highlighted in yellow`
        : `ℹ️ PDF scanned but no fields identified automatically`;
    }
    return data;
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `⚠️ Scan failed: ${e.message}`;
    return null;
  }
}

function fieldLabel(f) {
  return { provider: 'Provider', account_number: 'Account #', amount_due: 'Amount',
           statement_date: 'Statement Date', due_date: 'Due Date', category: 'Category' }[f] || f;
}

function applyOcrToForm(data, form) {
  const map = {
    provider: 'provider', account_number: 'account_number',
    amount_due: 'amount_due', statement_date: 'statement_date',
    due_date: 'due_date', category: 'category'
  };
  const detected = data._detected_fields || [];
  for (const [key, name] of Object.entries(map)) {
    if (data[key] == null) continue;
    const el = form.elements[name];
    if (!el) continue;
    // Only fill if field is empty
    if (!el.value || el.value === '') {
      el.value = data[key];
      if (detected.includes(key)) el.classList.add('ocr-filled');
    }
  }
}

async function submitBill(e) {
  e.preventDefault();
  const form = e.target;
  const id = document.getElementById('edit-id').value;
  const fd = new FormData(form);
  try {
    if (id) {
      await fetch(`/api/bills/${id}`, { method: 'PUT', body: fd });
      toast('Bill updated ✓');
    } else {
      await fetch('/api/bills', { method: 'POST', body: fd });
      toast('Bill added ✓');
    }
    closeModal();
    loadBills();
  } catch(err) {
    toast('Error: ' + err.message, 'err');
  }
}

async function deleteBill(id) {
  if (!confirm('Delete this bill?')) return;
  await api(`/api/bills/${id}`, { method: 'DELETE' });
  toast('Deleted');
  loadBills();
}

// ── Detail Panel ──────────────────────────────────────────────────────────────

async function openDetail(id) {
  const b = await api(`/api/bills/${id}`);
  allBillsForLink = currentBills.filter(x => x.id !== id);
  const today = new Date().toISOString().split('T')[0];
  const isOverdue = b.paid === 'N' && b.due_date && b.due_date < today;

  const linksHtml = b.links.length
    ? b.links.map(l => `
        <div class="link-item" onclick="openDetail(${l.linked_bill_id})">
          <div class="link-info">
            <div class="lp">${esc(l.provider)}</div>
            <div class="lm">${l.link_type} · ${l.due_date || '—'} · ${l.amount_due != null ? '$'+l.amount_due.toFixed(2) : '—'} · ${l.paid==='Y'?'Paid':'Unpaid'}${l.note?' · '+esc(l.note):''}</div>
          </div>
          <button class="link-del" onclick="event.stopPropagation(); removeLink(${l.link_id}, ${id})" title="Remove link">✕</button>
        </div>`).join('')
    : '<p style="color:var(--muted);font-size:13px">No linked records</p>';

  const linkOptions = allBillsForLink.map(x =>
    `<option value="${x.id}">${esc(x.provider)} — ${x.due_date||'?'} — ${x.amount_due!=null?'$'+x.amount_due.toFixed(2):'?'}</option>`
  ).join('');

  const pdfSection = b.pdf_filename ? `
    <p class="section-title" style="margin-top:24px">PDF Statement</p>
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
      <a href="/api/bills/${id}/pdf" target="_blank" class="btn btn-ghost btn-sm">Open PDF ↗</a>
      <button class="btn btn-ghost btn-sm" id="rescan-btn-${id}" onclick="rescanStoredPdf(${id})">🔍 Re-scan fields</button>
      <span id="rescan-status-${id}" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <iframe class="pdf-viewer" src="/api/bills/${id}/pdf"></iframe>
  ` : '';

  const statusBadges = `
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <span class="badge badge-${b.paid}">${b.paid==='Y'?'✓ Paid':'✗ Unpaid'}</span>
      ${b.in_collections==='Y'?'<span class="badge badge-col">⚠ Collections</span>':''}
      ${isOverdue?'<span class="badge badge-n">🔴 Overdue</span>':''}
    </div>`;

  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-provider">${esc(b.provider)}</div>
        <div style="color:var(--muted);font-size:13px">${esc(b.account_number||'No acct #')} ${b.category?'· <span class="badge badge-cat">'+esc(b.category)+'</span>':''}</div>
      </div>
      <button class="close-btn" onclick="document.getElementById('detail-overlay').classList.remove('open')">✕</button>
    </div>
    <div class="detail-amount">${b.amount_due != null ? '$'+b.amount_due.toFixed(2) : '—'}</div>
    ${statusBadges}

    <!-- Inline edit form -->
    <p class="section-title">Bill Details</p>
    <form id="detail-edit-form-${id}" onsubmit="saveDetailForm(event, ${id})" enctype="multipart/form-data">
      <div class="form-grid" style="margin-bottom:16px">
        <div class="field full">
          <label>Provider</label>
          <input type="text" name="provider" value="${esc(b.provider||'')}" required/>
        </div>
        <div class="field">
          <label>Account #</label>
          <input type="text" name="account_number" value="${esc(b.account_number||'')}"/>
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" name="category" value="${esc(b.category||'')}" list="cat-list"/>
        </div>
        <div class="field">
          <label>Statement Date</label>
          <input type="date" name="statement_date" value="${b.statement_date||''}"/>
        </div>
        <div class="field">
          <label>Amount Due ($)</label>
          <input type="number" step="0.01" name="amount_due" value="${b.amount_due!=null?b.amount_due:''}"/>
        </div>
        <div class="field">
          <label>Due Date</label>
          <input type="date" name="due_date" value="${b.due_date||''}"/>
        </div>
        <div class="field">
          <label>Paid</label>
          <div class="radio-row">
            <label><input type="radio" name="paid" value="N" ${b.paid==='N'?'checked':''}/> No</label>
            <label><input type="radio" name="paid" value="Y" ${b.paid==='Y'?'checked':''}/> Yes</label>
          </div>
        </div>
        <div class="field">
          <label>In Collections</label>
          <div class="radio-row">
            <label><input type="radio" name="in_collections" value="N" ${b.in_collections==='N'?'checked':''}/> No</label>
            <label><input type="radio" name="in_collections" value="Y" ${b.in_collections==='Y'?'checked':''}/> Yes</label>
          </div>
        </div>
        <div class="field full">
          <label>Replace PDF</label>
          <div class="pdf-zone" id="detail-pdf-zone-${id}">
            <input type="file" name="pdf" accept=".pdf" onchange="onDetailPdfChange(this, ${id})"/>
            <div>📄 <span id="detail-pdf-text-${id}">${b.pdf_filename ? '📎 '+esc(b.pdf_filename)+' (upload new to replace)' : 'Drop PDF or click to upload'}</span></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:24px">
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="deleteBill(${id}); document.getElementById('detail-overlay').classList.remove('open')">🗑 Delete</button>
      </div>
    </form>

    <!-- Audit Log -->
    <p class="section-title" style="margin-top:4px">Activity Log</p>
    <div class="audit-feed" id="audit-feed-${id}">
      ${renderUpdatesHtml(b.updates, id)}
    </div>
    <div class="audit-compose">
      <textarea id="audit-input-${id}" placeholder="Record an action, payment, call, dispute note…"></textarea>
      <div class="audit-compose-row">
        <input type="text" id="audit-author-${id}" placeholder="Your name" value=""/>
        <button class="btn btn-primary btn-sm" onclick="submitUpdate(${id})">+ Add Update</button>
      </div>
    </div>

    <p class="section-title">Linked Records</p>
    <div id="links-list-${id}">${linksHtml}</div>
    <div class="add-link-wrap" style="margin-top:10px;flex-direction:column;align-items:stretch">
      <select id="link-select-${id}" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px">
        <option value="">— Link to bill —</option>
        ${linkOptions}
      </select>
      <select id="link-type-${id}" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px">
        <option value="related">Related</option>
        <option value="continuation">Continuation</option>
        <option value="dispute">Dispute</option>
        <option value="payment-plan">Payment Plan</option>
      </select>
      <button class="btn btn-primary btn-sm" style="align-self:flex-start" onclick="addLink(${id})">Link</button>
    </div>
    ${pdfSection}
  `;
  document.getElementById('detail-overlay').classList.add('open');
}

async function saveDetailForm(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await fetch(`/api/bills/${id}`, { method: 'PUT', body: fd });
    toast('Changes saved ✓');
    loadBills();
    // Refresh the detail panel to reflect updated values
    openDetail(id);
  } catch(err) {
    toast('Save failed: ' + err.message, 'err');
  }
}

function onDetailPdfChange(input, id) {
  if (input.files[0]) {
    document.getElementById(`detail-pdf-text-${id}`).textContent = '📎 ' + input.files[0].name;
    document.getElementById(`detail-pdf-zone-${id}`).classList.add('has-file');
  }
}

async function addLink(billId) {
  const sel = document.getElementById(`link-select-${billId}`);
  const typeEl = document.getElementById(`link-type-${billId}`);
  if (!sel.value) return toast('Select a bill to link', 'err');
  try {
    await api(`/api/bills/${billId}/links`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ linked_bill_id: parseInt(sel.value), link_type: typeEl.value })
    });
    toast('Bills linked ✓');
    openDetail(billId);
  } catch(e) {
    toast('Already linked or error', 'err');
  }
}

async function removeLink(linkId, billId) {
  await api(`/api/links/${linkId}`, { method: 'DELETE' });
  toast('Link removed');
  openDetail(billId);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Bulk Upload ───────────────────────────────────────────────────────────────

let bulkFiles = []; // [{file, id, status}]
let bulkIdCounter = 0;

function openBulkModal() {
  bulkFiles = [];
  document.getElementById('bulk-queue').innerHTML = '';
  document.getElementById('bulk-defaults-wrap').style.display = 'none';
  document.getElementById('bulk-actions').style.display = 'none';
  document.getElementById('bulk-bar').style.width = '0';
  document.getElementById('bulk-progress').textContent = '';
  document.getElementById('bulk-import-btn').disabled = false;
  document.getElementById('bulk-overlay').classList.add('open');
  setupBulkDrop();
}

function closeBulkModal() {
  document.getElementById('bulk-overlay').classList.remove('open');
}

function setupBulkDrop() {
  const zone = document.getElementById('bulk-drop-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const files = [...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.pdf'));
    if (files.length) onBulkFiles(files);
  });
}

function onBulkFiles(fileList) {
  const newFiles = [...fileList].filter(f => f.name.toLowerCase().endsWith('.pdf'));
  if (!newFiles.length) { toast('No PDF files found', 'err'); return; }

  newFiles.forEach(f => {
    bulkFiles.push({ file: f, id: ++bulkIdCounter, status: 'pending',
      provider: f.name.replace(/\.pdf$/i, '').replace(/[-_]/g, ' '),
      category: '', amount: '', due_date: '', statement_date: '', paid: 'N', collections: 'N',
      scanning: true
    });
  });

  renderBulkQueue();
  document.getElementById('bulk-defaults-wrap').style.display = 'block';
  document.getElementById('bulk-actions').style.display = 'block';

  // Run OCR on each file in background
  newFiles.forEach(f => {
    const entry = bulkFiles.find(e => e.file === f);
    if (!entry) return;
    scanBulkFile(entry);
  });
}

function renderBulkQueue() {
  if (!bulkFiles.length) {
    document.getElementById('bulk-queue').innerHTML = '';
    return;
  }
  const rows = bulkFiles.map(entry => {
    const statusIcon = entry.status === 'done' ? '✅' : entry.status === 'error' ? '❌' : entry.status === 'uploading' ? '⏳' : '';
    const scanBadge = entry.scanning ? '<span style="font-size:10px;color:var(--muted)">🔍</span>'
      : entry.ocrFields && entry.ocrFields.length ? `<span class="ocr-badge" title="Auto-detected: ${entry.ocrFields.join(', ')}">✨ ${entry.ocrFields.length}</span>` : '';
    return `<div class="bulk-file-row ${entry.status}" id="bulk-row-${entry.id}">
      <div class="bulk-file-name">
        📄 ${esc(entry.file.name)} ${scanBadge}
        <span>${(entry.file.size / 1024).toFixed(0)} KB ${entry.errorMsg ? '· <span style="color:var(--danger)">'+esc(entry.errorMsg)+'</span>' : ''}</span>
      </div>
      <input type="text" placeholder="Provider *" value="${esc(entry.provider)}" class="${entry.ocrFields&&entry.ocrFields.includes('provider')?'ocr-filled':''}"
        oninput="bulkField(${entry.id},'provider',this.value)"/>
      <input type="text" placeholder="Category" value="${esc(entry.category)}" list="cat-list" class="${entry.ocrFields&&entry.ocrFields.includes('category')?'ocr-filled':''}"
        oninput="bulkField(${entry.id},'category',this.value)"/>
      <input type="number" step="0.01" placeholder="Amount" value="${entry.amount}" class="${entry.ocrFields&&entry.ocrFields.includes('amount_due')?'ocr-filled':''}"
        oninput="bulkField(${entry.id},'amount',this.value)"/>
      <input type="date" placeholder="Due Date" value="${entry.due_date}" class="${entry.ocrFields&&entry.ocrFields.includes('due_date')?'ocr-filled':''}"
        oninput="bulkField(${entry.id},'due_date',this.value)"/>
      <div class="bulk-status">${statusIcon}
        <button class="bulk-remove-btn" onclick="removeBulkFile(${entry.id})" title="Remove">✕</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('bulk-queue').innerHTML = `
    <div class="bulk-header">
      <div>File</div><div>Provider</div><div>Category</div><div>Amount</div><div>Due Date</div><div></div>
    </div>
    <div class="bulk-queue-wrap">${rows}</div>
    <p style="font-size:11px;color:var(--muted);margin-top:8px">${bulkFiles.length} file${bulkFiles.length!==1?'s':''} queued</p>
  `;
}

function bulkField(id, field, value) {
  const entry = bulkFiles.find(f => f.id === id);
  if (entry) entry[field] = value;
}

function removeBulkFile(id) {
  bulkFiles = bulkFiles.filter(f => f.id !== id);
  renderBulkQueue();
  if (!bulkFiles.length) {
    document.getElementById('bulk-defaults-wrap').style.display = 'none';
    document.getElementById('bulk-actions').style.display = 'none';
  }
}

function applyDefaults() {
  const cat = document.getElementById('bulk-default-category').value;
  const paid = document.querySelector('[name=bulk_paid]:checked').value;
  const col = document.querySelector('[name=bulk_collections]:checked').value;
  const due = document.getElementById('bulk-default-due').value;
  bulkFiles.forEach(f => {
    if (cat) f.category = cat;
    f.paid = paid;
    f.collections = col;
    if (due) f.due_date = due;
  });
  renderBulkQueue();
  toast('Defaults applied to all rows ✓');
}

async function scanBulkFile(entry) {
  const fd = new FormData();
  fd.append('pdf', entry.file);
  try {
    const r = await fetch('/api/scan', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const detected = data._detected_fields || [];
    entry.ocrFields = detected;
    // Apply detected fields (only fill empty ones)
    if (data.provider && !entry.provider.trim()) entry.provider = data.provider;
    else if (data.provider) {} // keep user's value, just badge it
    if (data.category && !entry.category) entry.category = data.category;
    if (data.amount_due && !entry.amount) entry.amount = data.amount_due;
    if (data.due_date && !entry.due_date) entry.due_date = data.due_date;
    if (data.statement_date) entry.statement_date = data.statement_date;
    // Re-apply detected provider if it was just the filename fallback
    const filenameGuess = entry.file.name.replace(/\.pdf$/i,'').replace(/[-_]/g,' ');
    if (data.provider && entry.provider.toLowerCase() === filenameGuess.toLowerCase()) {
      entry.provider = data.provider;
    }
  } catch(e) {
    entry.ocrFields = [];
  } finally {
    entry.scanning = false;
    renderBulkQueue();
  }
}

async function runBulkImport() {
  const pending = bulkFiles.filter(f => f.status === 'pending');
  if (!pending.length) { toast('No files to import', 'err'); return; }

  const missing = pending.filter(f => !f.provider.trim());
  if (missing.length) { toast(`${missing.length} file(s) missing Provider name`, 'err'); return; }

  document.getElementById('bulk-import-btn').disabled = true;
  let done = 0;

  for (const entry of pending) {
    entry.status = 'uploading';
    updateBulkRowStatus(entry.id, '⏳');
    try {
      const fd = new FormData();
      fd.append('provider', entry.provider.trim());
      fd.append('category', entry.category);
      fd.append('amount_due', entry.amount);
      fd.append('due_date', entry.due_date);
      fd.append('paid', entry.paid);
      fd.append('in_collections', entry.collections);
      fd.append('pdf', entry.file);
      const r = await fetch('/api/bills', { method: 'POST', body: fd });
      if (!r.ok) throw new Error(await r.text());
      entry.status = 'done';
      updateBulkRowStatus(entry.id, '✅');
    } catch(e) {
      entry.status = 'error';
      entry.errorMsg = e.message;
      updateBulkRowStatus(entry.id, '❌');
    }
    done++;
    const pct = Math.round(done / pending.length * 100);
    document.getElementById('bulk-bar').style.width = pct + '%';
    document.getElementById('bulk-progress').textContent = `${done} / ${pending.length} imported`;
  }

  const succeeded = pending.filter(f => f.status === 'done').length;
  const failed = pending.filter(f => f.status === 'error').length;
  toast(`Imported ${succeeded} bill${succeeded!==1?'s':''}${failed?' · '+failed+' failed':''}`, failed ? 'err' : 'ok');
  loadBills();
  if (!failed) setTimeout(closeBulkModal, 1200);
  else document.getElementById('bulk-import-btn').disabled = false;
}

function updateBulkRowStatus(id, icon) {
  const row = document.getElementById(`bulk-row-${id}`);
  if (!row) return;
  const statusDiv = row.querySelector('.bulk-status');
  if (statusDiv) {
    const btn = statusDiv.querySelector('button');
    statusDiv.innerHTML = icon;
    if (btn) statusDiv.appendChild(btn);
  }
  const entry = bulkFiles.find(f => f.id === id);
  if (entry && entry.status === 'done') row.classList.add('done');
  if (entry && entry.status === 'error') {
    row.classList.add('error');
    renderBulkQueue(); // re-render to show error message
  }
}

// ── OCR re-scan for stored PDFs ───────────────────────────────────────────────

async function rescanStoredPdf(billId) {
  const btn = document.getElementById(`rescan-btn-${billId}`);
  const status = document.getElementById(`rescan-status-${billId}`);
  btn.disabled = true;
  status.textContent = '🔍 Scanning…';
  try {
    const data = await api(`/api/bills/${billId}/scan`, { method: 'POST' });
    const detected = data._detected_fields || [];
    const form = document.getElementById(`detail-edit-form-${billId}`);
    if (form) applyOcrToForm(data, form);
    const method = data._method === 'ocr' ? 'OCR' : 'text';
    status.innerHTML = detected.length
      ? `✨ Found ${detected.length} field${detected.length>1?'s':''} (${method}): <strong>${detected.map(f=>fieldLabel(f)).join(', ')}</strong>`
      : `ℹ️ No fields identified (${method})`;
  } catch(e) {
    status.textContent = '⚠️ Scan failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// ── Audit Log ─────────────────────────────────────────────────────────────────

function renderUpdatesHtml(updates, billId) {
  if (!updates || !updates.length) {
    return '<p class="audit-empty">No activity recorded yet.</p>';
  }
  return updates.map(u => `
    <div class="audit-entry" id="audit-entry-${u.id}">
      <div class="audit-dot"></div>
      <div class="audit-body">
        <div class="audit-meta">
          <strong>${esc(u.author)}</strong> &nbsp;·&nbsp; ${formatTs(u.created_at)}
          <button class="audit-del" onclick="deleteUpdate(${u.id}, ${billId})" title="Delete">✕</button>
        </div>
        <div class="audit-note">${esc(u.note)}</div>
      </div>
    </div>`).join('');
}

function formatTs(ts) {
  if (!ts) return '—';
  const d = new Date(ts.replace(' ', 'T') + 'Z');
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function submitUpdate(billId) {
  const noteEl = document.getElementById(`audit-input-${billId}`);
  const authorEl = document.getElementById(`audit-author-${billId}`);
  const note = noteEl.value.trim();
  if (!note) { toast('Enter a note before adding', 'err'); return; }
  try {
    const u = await api(`/api/bills/${billId}/updates`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note, author: authorEl.value.trim() || 'User' })
    });
    noteEl.value = '';
    // Prepend new entry to feed without full re-render
    const feed = document.getElementById(`audit-feed-${billId}`);
    const empty = feed.querySelector('.audit-empty');
    if (empty) empty.remove();
    feed.insertAdjacentHTML('afterbegin', renderUpdatesHtml([u], billId));
    toast('Update added ✓');
  } catch(e) {
    toast('Failed: ' + e.message, 'err');
  }
}

async function deleteUpdate(updateId, billId) {
  if (!confirm('Delete this activity entry?')) return;
  await api(`/api/updates/${updateId}`, { method: 'DELETE' });
  const el = document.getElementById(`audit-entry-${updateId}`);
  if (el) el.remove();
  const feed = document.getElementById(`audit-feed-${billId}`);
  if (feed && !feed.querySelector('.audit-entry')) {
    feed.innerHTML = '<p class="audit-empty">No activity recorded yet.</p>';
  }
  toast('Entry deleted');
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadBills();
</script>
